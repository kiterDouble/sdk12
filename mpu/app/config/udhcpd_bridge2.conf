# 网桥接口
interface       bridge2

# 起始和结束IP地址范围
start           192.168.1.210
end             192.168.1.242

# 子网掩码和租约时间
option  subnet  255.255.255.0
option  lease   864000      # 10天（单位：秒）

# 默认网关（通常是宿主机或路由器IP）
option  router  192.168.1.1

# DNS服务器
option  dns     192.168.1.1

# DHCP服务器自身的IP（可选）
#server         192.168.1.1

# 域名（可选）
option  domain  local

# 广播地址（通常自动计算）
#option broadcast  192.168.1.255

# 设置默认租约文件位置
lease_file /oemdata/log/udhcpd.leases