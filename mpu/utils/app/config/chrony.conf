# 使用 pool.ntp.org 项目中的公共服务器。以server开，理论上想添加多少时间服务器都可以。
#server 222.217.61.68 iburst minpoll 12 maxpoll 12
#server ntp.aliyun.com iburst minpoll 3 maxpoll 12
#server cn.ntp.org.cn iburst minpoll 3 maxpoll 12
server cn.ntp.org.cn iburst minpoll 3 maxpoll 12
server ntp.aliyun.com iburst minpoll 3 maxpoll 12
server pool.ntp.org iburst minpoll 3 maxpoll 12
# 根据实际时间计算出服务器增减时间的比率，然后记录到一个文件中，在系统重启后为系统做出最佳时间补偿调整。
driftfile /oemdata/chrony/drift

# 如果系统时钟的偏移量大于1秒，则允许系统时钟在前三次更新中步进。
makestep 1.0 3

# 启用实时时钟（RTC）的内核同步。
rtcsync

# 通过使用 hwtimestamp 指令启用硬件时间戳
hwtimestamp *

# 增加调整系统时钟所需的最小可选源数。
minsources 1

# 即使未同步到时间源，也要提供时间。
# Serve time even if not synchronized to a time source. （取值范围1-15，当默认时钟源无法同步，则当前系统层级为10）
local stratum 10

# 指定包含 NTP 身份验证密钥的文件。
# keyfile /etc/chrony.keys

allow 0.0.0.0/0

# 指定日志文件的目录。
logdir /oemdata/log/

# 选择日志文件要记录的信息。
log measurements statistics tracking
