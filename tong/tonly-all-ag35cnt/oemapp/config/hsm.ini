[hsm]
# 1: spi, 2: i2c
select=2
# 1: support irq, 2: not support irq(not used currently)
supportIrq=2

# A样 resetPin=42 ; A1样, B样  resetPin=32

[spi]
dev=/dev/spidev2.0
speed=15000000
mode=0
# data size
bpw=8
resetPin=32
# not used currently
irqPin=38

[i2c]
dev=/dev/i2c-0
speed=100000
#slave address: 0x2A
slaveAddr=42
timeout=700
retry=3
resetPin=32
irqPin=31
