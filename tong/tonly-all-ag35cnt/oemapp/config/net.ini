[base]
apnNum=1
netAutoDail=1
dnsPathName=/etc/resolv.conf
highSpeedModeEnable=0
ledPinNum=8
beWinnerSimCardEnable=1
apnDialPriInterval=10
apnDialSecInterval=120
apnDialSuccOneHourThresHoldCount=21

[apn0]
pid=1
pdpType=0			#0:QL_APN_PDP_TYPE_IPV4 ,1:QL_APN_PDP_TYPE_PPP, 2:QL_APN_PDP_TYPE_IPV6,3:QL_APN_PDP_TYPE_IPV4V6,
authProto=0			#0:QL_APN_AUTH_PROTO_DEFAULT,1:QL_APN_AUTH_PROTO_NONE,2:QL_APN_AUTH_PROTO_PAP,3:QL_APN_AUTH_PROTO_CHAP,4:QL_APN_AUTH_PROTO_PAP_CHAP,
apnName=alyygjx.vpdn.sd
apnUserName=
apnPassWd=
routeIp=default;
domain=
nameserverPri=1     #0: first choice ,1: add choice  
dnsRouteSet=1       #0: not set ,1: set

[apn1]
pid=2
pdpType=0			#0:QL_APN_PDP_TYPE_IPV4 ,1:QL_APN_PDP_TYPE_PPP, 2:QL_APN_PDP_TYPE_IPV6,3:QL_APN_PDP_TYPE_IPV4V6,
authProto=0			#0:QL_APN_AUTH_PROTO_DEFAULT,1:QL_APN_AUTH_PROTO_NONE,2:QL_APN_AUTH_PROTO_PAP,3:QL_APN_AUTH_PROTO_CHAP,4:QL_APN_AUTH_PROTO_PAP_CHAP,
apnName=aion5g01.gd.iot
apnUserName=
apnPassWd=
routeIp=-net 10.0.0.0/8;
domain=
nameserverPri=1     #0: first choice ,1: add choice  
dnsRouteSet=1       #0: not set ,1: set

[apn2]
pid=3
pdpType=0			#0:QL_APN_PDP_TYPE_IPV4 ,1:QL_APN_PDP_TYPE_PPP, 2:QL_APN_PDP_TYPE_IPV6,3:QL_APN_PDP_TYPE_IPV4V6,
authProto=0			#0:QL_APN_AUTH_PROTO_DEFAULT,1:QL_APN_AUTH_PROTO_NONE,2:QL_APN_AUTH_PROTO_PAP,3:QL_APN_AUTH_PROTO_CHAP,4:QL_APN_AUTH_PROTO_PAP_CHAP,
apnName=gac3.ctiot
apnUserName=
apnPassWd=
routeIp=-net 10.0.0.0/8;
domain=
nameserverPri=1     #0: first choice ,1: add choice  
dnsRouteSet=1       #0: not set ,1: set


# 驻网异常 处理配置
[check_reg]
regFailTriggerResetNetPeriod=150                 # 驻网失败 触发重启网络时长(单位：秒)
regFailResetNetTriggerResetTboxCount=1           # 驻网失败 重启网络累计次数 触发重启Tbox (如果不触发tbox重启，可以配置 UINT32_MAX(4294967295))

# 拨号异常 处理配置
[check_apn_dial]
apnDialFailTriggerResetNetPeriod=110             # APN拨号失败 触发重启网络周期 
apnDialFailResetNetTriggerResetTboxCount=3       # APN拨号失败 重启网络累计次数 触发重启Tbox (如果不触发tbox重启，可以配置 UINT32_MAX(4294967295))

# 网络制式异常 处理配置
[check_net_type]
resetNetPeriod=10                                # 驻网非4G 触发重启网络周期(最多配置20个周期，使用 ',' 隔开) 
resetNetMaxCount=3                               # 驻网非4G 触发重启网络最大次数 (如果不做限制，可以配置 UINT32_MAX(4294967295))

# 网络连接异常（ping） 处理配置
[check_net_connection]
pingCycleDurationSecond=120                      # ping 周期
pingFailedCountTriggerResetNet=5                 # ping持续失败 触发重启网络  (如果不触发重启网络，可以配置 UINT32_MAX(4294967295))
pingFailedResetNetCountTriggerResetTbox=3        # ping持续失败 重启网络累计次数 触发重启Tbox  (如果不触发tbox重启，可以配置 UINT32_MAX(4294967295))

