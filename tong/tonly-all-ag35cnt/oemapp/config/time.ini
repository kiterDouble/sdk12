# timeServer 授时服务配置文件
# 说明：
#   - 本配置文件定义系统支持的授时方式及其参数
#   - priority 字段同时控制"是否启用"和"优先级"：
#       * priority > 0 ：启用该授时方式，数值越大优先级越高
#       * priority = 0 或省略：禁用该授时方式
#   - 若需临时禁用某个授时方式但保留配置，将其 priority 设为 0 即可
[rtc]
dev=/dev/rtc0

[timeJumpEvent]
# 时间异常跳变阀值，单位秒
threshold=60

[tsp]
# 活性时间，单位秒
activation=1800
# 优先级，数值越大优先级越高；priority=0 表示禁用 TSP 授时
priority=10

[ntp]
# NTP 授时服务器地址（支持 ; 分隔多个地址）
hosts=ntp.ntsc.ac.cn;ntp.aliyun.com
# 活性时间，单位秒
activation=600
# 优先级，数值越大优先级越高；priority=0 表示禁用 NTP 授时
priority=30

[gnss]
# 活性时间，单位秒
activation=3600
# 优先级，数值越大优先级越高；priority=0 表示禁用 GNSS 授时
priority=20


