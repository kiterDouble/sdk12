#comments
[global]
strict init = true

buffer min = 1024

buffer max = 2MB

rotate lock file = /oemdata/log/zlog.log

default format = "%d.%us %-6V %c(%p)[%f:%L]:%m %n"

file perms = 600

fsync period = 10

[formats]
simple = "%m%n"
normal = "%d %m%n"

[rules]
digitalKey.DEBUG      "/oemdata/log/digitalKeyLog", 20MB*1 ~ "/oemdata/log/digitalKeyLog.#r"
