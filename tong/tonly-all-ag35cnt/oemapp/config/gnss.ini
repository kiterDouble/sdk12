[gnss]
# 0:模组定位 1:TAU804M-N2B0
moduleType=0
# 外部gnss模组串口
dev=/dev/ttyS3
# gnss指示灯
pin_number=47
[ant]
# gnss天线检测adc配置 单位mv
# gnss天线短路至地的上限电压 低于此值判断为短路至地
ant_detect_short_gnd_max=400
# gnss天线正常电压值下限
ant_detect_normal_min=1600
# gnss天线正常电压值上限 检测值于正常电压值区间时判断为天线正常
ant_detect_normal_max=2000
# gnss天线开路电压下限
ant_detect_open_min=2084
# gnss天线开路电压上限 检测值于天线开路电压值区间时判断为天线开路
ant_detect_open_max=2284
# gnss天线短路至电源电压下限 高于此值判断为短路至电源
ant_detect_short_vcc_min=3000

