[base]
routeNum=5

# type  ：0:domain, 1:ip
# domain：域名/ip地址
# dnsPid：指定域名解析走公网还是私网 1:车企付费公网，2:私网 3:用户付费公网
# ethPid：指定数据业务走公网还是私网 1:车企付费公网，2:私网 3:用户付费公网

[route0]
type=0
domain=pre-mqtt-private-access.gacicv.com
dnsPid=2
ethPid=2

[route1]
type=0
domain=pre-mqtt-public-access.gacicv.com
dnsPid=1
ethPid=1

[route2]
type=0
domain=pre-ota.gacicv.com
dnsPid=2
ethPid=2

[route3]
type=0
domain=pre-sm-cms.gacicv.com
dnsPid=1
ethPid=1

[route4]
type=1
domain=47.97.113.255
dnsPid=1
ethPid=1
