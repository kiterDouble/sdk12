[tcp]
host = 123.138.199.226
port = 40010
reconnect_interval = 10

[http]
base_url = http://iot.tonly.com/api

[device]
vin = LSNZLFYA1P1000001
iccid = 898600MFSSYYG123456P
sw_version = 1
hw_version = 1
main_mcu_version = 1
sub_mcu_version = 1
non_stage4_version = 1

[offline]
offline_dir = /mnt/sdcard/data
offline_max_days = 3

[ota]
save_dir = /sdcard/ota_master
unzip_dir = /sdcard/ota_master
ota_master_config_dir = /sdcard/ota_master/config
use_libcurl = 1

[recorder]
recorder_enable = 0
recorder_dir = /sdcard/can_log
recorder_max_size_mb = 50
recorder_sample_ms = 10
recorder_channels = 15

[heartbeat]
interval = 60

[log]
level = DEBUG
path = ./tly.log
