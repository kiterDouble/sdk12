# 自动重启配置文件
# 注：本配置控制 pmServer 在满足条件时自动重启 MPU
# 所有 durationMin 单位均为“分钟”，值为 0 表示不启用该重启机制

[UpTimeAutoReboot]
# 从上一次重启/开机到现在的挂钟时长阈值（含休眠时间），达到后触发一次自动重启
durationMin=4320
# 唤醒原因限制（取值参考 PM_WAKEUP_SOURCE_*），0 表示不限制唤醒原因
wakeUpReason=0
# 是否允许启动时长达到阈值后通过 RTC 唤醒系统以执行重启：1=启用，0=禁用
rtcWakeUpTrigger=1


[WorkTimeAutoReboot]
# 从上一次重启以来累计工作时长阈值（休眠期间不计），达到后下次进入休眠前触发自动重启
durationMin=1440
# 唤醒原因限制（取值参考 PM_WAKEUP_SOURCE_*），0 表示不限制唤醒原因
wakeUpReason=0
