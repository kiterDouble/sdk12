[base]
logNum=2
checkInterval=10
bootUpDelay=60                       #开机后延迟打包时间，单位秒
wakeUpDelay=30                       #唤醒后延迟打包时间，单位秒


[log0]
name=sirun
maxStoreSize=800000000               #总存储大小，800M
cryptoFlag=0                         #加密标志 (des3加密)
cryptoPassword=""                    #加密密码
logPath="/oemdata/log/"
logPackPath="/oemdata/log/logstore/"
logRotatedFileName="sirunlog.0"

[log1]
name=otaMaster
maxStoreSize=100000000               #总存储大小，100M
cryptoFlag=0                         #加密标志 (des3加密)
cryptoPassword=""                    #加密密码
logPath="/oemdata/log/"
logPackPath="/oemdata/log/logstore/"
logRotatedFileName="otaMasterLog.0"


